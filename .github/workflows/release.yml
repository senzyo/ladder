name: Build and release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: pwsh

jobs:
  manual-check:
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/check.yml

  verify-tag:
    if: github.event_name == 'push'
    runs-on: windows-2025
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2
      - name: Verify version and successful check for the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $metadata = cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $version = ($metadata.packages | Where-Object name -eq 'ladder').version
          if ($env:GITHUB_REF_NAME -cne "v$version") { throw 'Tag does not match Cargo.toml version.' }

          $commit = git rev-parse HEAD
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $parents = (git show -s --format=%P HEAD) -split ' '
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $heads = @($commit)
          # GitHub indexes a PR run under the PR head, the merge preview's second parent.
          if ($parents.Count -eq 2) { $heads += $parents[1] }
          foreach ($head in $heads) {
            $endpoint = "repos/$env:GITHUB_REPOSITORY/actions/workflows/check.yml/runs?head_sha=$head&status=success&per_page=100"
            $source = if ($head -ceq $commit) {
              'select((.event == "push" and .head_branch == "main") or .event == "workflow_dispatch")'
            } else {
              'select(.event == "pull_request" and any(.pull_requests[]?; .base.ref == "main"))'
            }
            $titles = @(gh api --paginate $endpoint --jq ".workflow_runs[] | select(.head_repository.full_name == .repository.full_name) | $source | .display_title")
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            if ($titles -ccontains "Check $commit") {
              Write-Host "Found successful Check for $commit."
              return
            }
          }
          throw "No successful Check for $commit. Complete the Check workflow for this exact commit, then re-run the failed jobs."

  package:
    needs: [manual-check, verify-tag]
    if: >-
      !cancelled() && (needs.manual-check.result == 'success' || needs.verify-tag.result == 'success')
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        architecture: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Package
        run: ./scripts/release.ps1 -Architecture '${{ matrix.architecture }}'
      - name: Verify release archive and checksum
        if: matrix.architecture == 'amd64'
        run: ./scripts/test-release.ps1 -PackageOnly -Executable ./target/x86_64-pc-windows-msvc/release/ladder.exe
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ladder-${{ matrix.architecture }}
          if-no-files-found: error
          compression-level: 0
          path: |
            dist/*.zip
            dist/*.zip.sha256

  release:
    needs: package
    if: github.event_name == 'push'
    runs-on: windows-2025
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: ladder-*
          merge-multiple: true
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $files = @(Get-ChildItem -LiteralPath dist -File | ForEach-Object FullName)
          if ($files.Count -ne 4) { throw 'Both architectures and checksums are required.' }
          $arguments = @('release', 'create', $env:RELEASE_TAG, '--verify-tag', '--title', $env:RELEASE_TAG, '--generate-notes')
          if ($env:RELEASE_TAG.Contains('-')) { $arguments += '--prerelease' }
          gh @arguments @files
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
