[package]
name = "ladder-dns-recovery"
version = "3.0.0"
edition = "2024"
license = "MIT"

[workspace]

[dependencies]
same-file = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows-registry = "0.6"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_System_SystemInformation",
    "Win32_UI_Shell",
] }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "unwind"
