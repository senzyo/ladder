[package]
name = "ladder"
version = "0.1.0"
edition = "2024"
license = "MIT"

[[bin]]
name = "ladder"
path = "src/main.rs"
test = false

[dependencies]
anyhow = "1"
async-channel = "2"
# 桌面程序自行提供含 UAC 和 DPI 设置的清单，避免与 GPUI 的默认清单重复。
gpui = { version = "0.2.2", default-features = false, features = ["font-kit", "wayland", "x11"] }
raw-window-handle = "0.6"
same-file = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tray-icon = { version = "0.21", default-features = false }
windows-registry = "0.6"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Dwm",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
winresource = "0.1"

[dev-dependencies]
tempfile = "3"

[profile.dev]
debug = 0

